[workspace]
# `crates/techniques/*` glob: stage-axis extension techniques are workspace members
# just by adding a folder (zero-compile plugin extension). Linking one into the
# binary takes a one-line dependency.
members = [
    "engine",
    "crates/argus-extension-api",
    "crates/argus-kv-codec",
    "crates/techniques/*",
]
resolver = "3"

# Common package metadata inherited by every member via `field.workspace = true`.
# Single source of truth for version / edition / MSRV / license / repository.
[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV tracks the latest stable toolchain we build/test with (the code uses APIs
# stabilized after the edition-2024 floor, e.g. `is_multiple_of` in 1.87).
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hedone21/argus-engine"
authors = ["Argus contributors"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

# TEMPORARY — must be removed before this branch merges.
#
# The `argus-shared` dependency is pinned to that repo's `main`, which still carries the
# v1 contract; this branch speaks v2. Until argus-shared#2 lands on its main there is no
# published revision to build against, so development resolves the dependency through a
# sibling checkout instead.
#
# The path is relative and CI checks out this repo alone, so every job fails at manifest
# resolution while this stanza is present. That is expected: the branch is a draft and is
# blocked on argus-shared#2 regardless.
#
# To land: merge argus-shared#2, delete this stanza, `cargo update -p argus-shared` to
# repin the lock at the merged revision, and take the PR out of draft.
[patch."https://github.com/hedone21/argus-shared.git"]
argus-shared = { path = "../argus-shared" }
